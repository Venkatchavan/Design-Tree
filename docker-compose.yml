# DesignTree production stack — single in-house Windows server.
#
#   browser ──443──▶ gateway ─┬─ /          SPA static files
#                             ├─ /api/      api:5000 (cookie auth untouched)
#                             └─ /dbadmin/  mongo-express (FD only: IP + basic-auth + app login)
#
# Data survival:
#   - mongo-data (BIND to C:/DesignTree/mongo-data on the host SSD)
#     survives container removal/rebuild AND `down -v` / `volume prune`
#     (compose never deletes bind-mounted host paths).
#   - uploads (BIND to the live uploads dir) survive everything, including
#     `down -v`, because the files live on the host filesystem.
#
# RUNBOOK RULE: backups still run before every upgrade (binds protect against
# volume deletion, not against content damage) — see docs/BACKUP_RESTORE.md.
#
# First boot:  docker compose up -d --build
#              docker compose run --rm api npm run seed   (one-shot FD login)

name: designtree

services:
  mongo:
    image: mongo:7
    container_name: designtree-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: designtree
    volumes:
      # Database files — host bind (C:/DesignTree/mongo-data) so the data
      # survives even `down -v` / `volume prune`. Folder must exist on the
      # host before first boot (see docs/DEPLOYMENT.md).
      - type: bind
        source: ${HOST_MONGO_DIR}
        target: /data/db
      # Dump landing dir for scripts/backup.ps1 (host HDD).
      - type: bind
        source: ${HOST_BACKUPS_DIR}
        target: /backups
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ping:1})'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    image: designtree-api:latest
    container_name: designtree-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/designtree?authSource=admin
      # Inside-container path. The actual bytes live on the host HDD
      # through the bind mount below — never inside the image.
      UPLOAD_DIR: /data/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    volumes:
      - type: bind
        source: ${HOST_UPLOADS_DIR}
        target: /data/uploads
    networks:
      - frontend
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    # Mirrors the HEALTHCHECK baked into api/Dockerfile (explicit here so
    # `docker compose ps` expectations and gateway's service_healthy gate
    # don't depend on image metadata alone).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: designtree-gateway:latest
    container_name: designtree-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS cert + dbadmin password file. Read-only mounts; the real
      # files are created on the host during deployment (never committed).
      - type: bind
        source: ./certs
        target: /etc/nginx/certs
        read_only: true
      - type: bind
        source: ./gateway/.htpasswd
        target: /etc/nginx/.htpasswd
        read_only: true
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1
    container_name: designtree-dbadmin
    restart: unless-stopped
    # NO ports published: reachable only through gateway /dbadmin/
    # (IP allowlist + basic-auth) on the frontend network.
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
      ME_CONFIG_SITE_BASEURL: /dbadmin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    networks:
      - frontend
      - backend
    depends_on:
      mongo:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
