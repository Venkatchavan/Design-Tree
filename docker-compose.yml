# DesignTree production stack — single in-house Windows server.
#
#   browser ──80/443──▶ gateway ─┬─ /          SPA static files
#                                 ├─ /api/      api:5000 (cookie auth untouched)
#                                 └─ /dbadmin/  mongo-express (FD only: IP + basic-auth + app login)
#
# IP-based deployment: no domain, no Cloudflare tunnel. HTTPS uses a
# Let's Encrypt certificate for the public IP (short-lived, auto-renewed by
# the certbot sidecar); port 80 serves the app + ACME challenges.
#
# Data survival:
#   - mongo-data (NAMED VOLUME designtree_mongo-data — this is where the live
#     database actually resides). Survives container removal/rebuild and plain
#     `down`, but NOT `down -v` / `volume prune` — those delete it. Never run
#     either without a verified backup (see docs/BACKUP_RESTORE.md).
#   - uploads (BIND to the live uploads dir) survive everything, including
#     `down -v`, because the files live on the host filesystem.
#
# RUNBOOK RULE: backups still run before every upgrade — see docs/BACKUP_RESTORE.md.
#
# First boot:  docker compose up -d --build
#              docker compose run --rm api npm run seed   (one-shot FD login)

name: designtree

services:
  mongo:
    image: mongo:7
    container_name: designtree-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: designtree
    volumes:
      # Database files — NAMED VOLUME (see top-level `volumes:`). This must
      # stay a named volume: the live data resides in designtree_mongo-data.
      # Do NOT convert to a host bind without migrating data first.
      - type: volume
        source: mongo-data
        target: /data/db
      # Dump landing dir for scripts/backup.ps1 (host HDD).
      - type: bind
        source: ${HOST_BACKUPS_DIR}
        target: /backups
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ping:1})'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    image: designtree-api:latest
    container_name: designtree-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/designtree?authSource=admin
      # Inside-container path. The actual bytes live on the host HDD
      # through the bind mount below — never inside the image.
      UPLOAD_DIR: /data/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    volumes:
      - type: bind
        source: ${HOST_UPLOADS_DIR}
        target: /data/uploads
    networks:
      - frontend
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    # Mirrors the HEALTHCHECK baked into api/Dockerfile (explicit here so
    # `docker compose ps` expectations and gateway's service_healthy gate
    # don't depend on image metadata alone).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: designtree-gateway:latest
    container_name: designtree-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Router: WAN:80 → host 80 (HTTP + ACME), WAN:443 → host 4433 (public
      # HTTPS with the Let's Encrypt IP cert). Host 443 stays LAN-only HTTPS
      # with the bootstrap cert (SANs: LAN IP + public IP) for the LAN CA.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PUBLIC_PORT:-4433}:4433"
    volumes:
      # Bootstrap cert (used until the Let's Encrypt IP cert is issued) and
      # the dbadmin password file (host-local, never committed).
      - type: bind
        source: ./certs
        target: /etc/nginx/bootstrap
        read_only: true
      - type: bind
        source: ./certs/letsencrypt
        target: /etc/letsencrypt
        read_only: true
      - type: bind
        source: ./certs/acme-webroot
        target: /var/www/certbot
        read_only: true
      - type: bind
        source: ./gateway/.htpasswd
        target: /etc/nginx/.htpasswd
        read_only: true
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  # Requests and renews a Let's Encrypt certificate for the public IP.
  # Needs WAN:80 forwarded to the gateway for HTTP-01 validation. Writes
  # into the shared certs volume; the gateway reloads nginx automatically.
  certbot:
    image: certbot/certbot:latest
    container_name: designtree-certbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./certs/letsencrypt
        target: /etc/letsencrypt
      - type: bind
        source: ./certs/acme-webroot
        target: /var/www/certbot
      - type: bind
        source: ./scripts/certbot-entrypoint.sh
        target: /opt/designtree/certbot-entrypoint.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/designtree/certbot-entrypoint.sh"]
    depends_on:
      gateway:
        condition: service_started

  mongo-express:
    image: mongo-express:1
    container_name: designtree-dbadmin
    restart: unless-stopped
    # Permanent loopback-only direct access (no app downtime to enable):
    # http://127.0.0.1:18081/dbadmin/ on the server itself + SSH tunnel
    # (ssh -N -L 18081:127.0.0.1:18081 <user>@server) for FD remote.
    # Bound to 127.0.0.1 so LAN/WAN cannot reach it. Gateway /dbadmin/
    # stays closed (Docker Desktop NAT masks all clients as 172.18.0.1,
    # so its allow 127.0.0.1/192.168.1.50 never matches -> 403 by design).
    ports:
      - "127.0.0.1:18081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
      ME_CONFIG_SITE_BASEURL: /dbadmin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    networks:
      - frontend
      - backend
    depends_on:
      mongo:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  # Live database files (adopted: the pre-existing designtree_mongo-data
  # volume). Compose manages it; `down -v` / `volume prune` would DELETE it.
  mongo-data:
