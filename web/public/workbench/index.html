  def('pilecap', {

      H2('8. Step-by-step calculations'); T(['#', 'Description', 'Formula', 'Substitution', 'Result', 'Ref.'], r.S.steps.map((s, i) => [String(i + 1), s.label, s.kind === 'f' ? `${E.symOf(s.key)} = ${s.sym}` : `${E.symOf(s.key)} <- ${s.how || 'procedure'}`, s.kind === 'f' ? s.sub : '', `${typeof s.val === 'number' ? fmt(s.val) : s.val} ${s.unit && s.unit !== '—' ? s.unit : ''}`, s.ref]), { columnStyles: { 0: { cellWidth: 7 }, 1: { cellWidth: 38 }, 2: { cellWidth: 48 }, 3: { cellWidth: 48 }, 4: { cellWidth: 22 } } });
      r.S.tables.forEach((t) => { H2(t.title); T(t.cols, t.rows.map((x) => x.map(String)), t.cols.length > 10 ? { styles: { fontSize: 5.6, cellPadding: 0.6, overflow: 'linebreak' } } : {}); });
      const libs = [...new Set(r.S.steps.filter((s) => s.libId).map((s) => s.libId))];
      H2('9. Formula references (central library)'); T(['Id', 'Formula', 'Code and clause', 'Expression'], libs.map((id) => [id, FL[id].title, `${FL[id].code}, ${FL[id].clause}`, FL[id].expr || '']));
      H2('10. Reinforcement calculations'); T(['Quantity', 'Value', 'Unit'], r.S.steps.filter((s) => /steel|bars?|Ast|spacing|Asc|hoop|tie/i.test(s.label)).map((s) => [s.label, fmtv(s.val), s.unit || '']));
      H2('11. Code compliance checks'); T(['Check', 'Demand', 'Capacity', 'Status', 'Reference'], r.S.checks.map((c) => [c.label, c.flag ? '' : `${fmt(c.d)} ${c.unit || ''}`, c.flag ? (c.note || '') : `${c.op} ${fmt(c.c)}`, c.status, c.ref]));
      H2('12. Final reinforcement arrangement'); T(null, r.S.outs.map((o) => [o.label, o.value]));
      H2('13. Design status'); T(null, [[`${r.status} — utilisation ${r.util ? fmt(r.util) : '-'}; governing: ${r.gov || '-'}`], [r.status === 'PASS' ? 'All applicable checks satisfied. Subject to engineer approval.' : 'Not suitable for issue until the FAIL / REVIEW / INPUT REQUIRED items are resolved.']]);
      H2('14. Engineer review and approval'); T(['Action', 'By', 'Date', 'Comment'], [...(e.approvals || []).map((a) => [a.action, who(a.by), dt(a.at), a.comment || '']), ['Prepared', P.engineer || '', '', 'Signature: ____________'], ['Checked', P.checker || '', '', 'Signature: ____________'], ['Approved', P.approver || '', '', 'Signature: ____________']]);
    }
    const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7); doc.setTextColor(110); doc.text(`Page ${i} of ${n} — calculation aid; subject to review and approval by a qualified structural engineer`, W / 2, 292, { align: 'center' }); }
    await save(`${safeName(P.name)}_${els.length === 1 ? safeName(inputsOf(els[0]).mark) : 'report'}.pdf`, doc.output('blob'));
