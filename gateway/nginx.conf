# DesignTree gateway — nginx reverse proxy + SPA host.
# Baked into the gateway image (gateway/Dockerfile).
#
#   /          → SPA static files (React build output)
#   /api/      → api:5000 (cookie auth passes through untouched)
#   /dbadmin/  → blocked; optional DB admin is loopback-only on the host
#
# >>> EDIT-ME BEFORE DEPLOY: search this file for EDIT-ME (server_name,
# >>> ssl paths if renamed).

upstream api_backend {
    server api:5000;
}

# Login brute-force guard: max ~10 login attempts/minute per IP,
# bursts of 20 allowed, excess rejected with 503.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    # Plain HTTP exists only to bounce browsers to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # EDIT-ME: the IPs/hostnames users type. Dual-origin: public IP first
    # (canonical), LAN IP second for direct LAN access. Must match the
    # certificate SANs (see docs/DEPLOYMENT.md).
    server_name 103.169.236.122 192.168.1.50;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Multipart uploads are capped at 10 MB by the API; 20m leaves
    # headroom for form overhead without opening abuse floodgates.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # --- Live bell pushes (socket.io). Single server, so no sticky-session
    # handling is needed; the Upgrade headers are the critical part.
    location /socket.io/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-poll fallback + WS both stream; buffering would delay pushes.
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- API: cookie JWT passes through; nothing is stripped. ---
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Slow down password guessing on the sign-in endpoint only.
    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The legacy admin image is optional and never proxied to LAN/WAN.
    # Explicit 403 also lets nginx start while that service is disabled.
    location /dbadmin/ {
        return 403;
    }
    location = /dbadmin {
        return 403;
    }

    # --- PWA manifest: stock mime.types has no .webmanifest entry, so serve
    # it with the spec type here. Exact-match wins over `location /`.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    # --- SPA: static files, client-side routing fallback. ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
