# DesignTree gateway — nginx reverse proxy + SPA host.
# Baked into the gateway image (gateway/Dockerfile).
#
#   /          → SPA static files (React build output)
#   /api/      → api:5000 (cookie auth passes through untouched)
#   /dbadmin/  → mongo-express (Founding Director only: basic-auth + IP allowlist)
#
# Listens on:
#   80    HTTP app + ACME challenges (LAN and public)
#   443   LAN HTTPS, bootstrap cert (covers both the LAN and public IPs)
#   4433  public HTTPS, Let's Encrypt IP cert when issued, else bootstrap
#
# The router must forward WAN:443 -> this host's 4433, so the public URL stays
# https://<public-ip> while LAN clients keep the internal cert on 443.
# __CERT_PATH__ / __KEY_PATH__ are always the bootstrap pair.
# __PUBLIC_CERT_PATH__ / __PUBLIC_KEY_PATH__ are the Let's Encrypt pair when
# present, otherwise the bootstrap pair.

upstream api_backend {
    server api:5000;
}

upstream dbadmin_backend {
    server mongo-express:8081;
}

# Login brute-force guard: max ~10 login attempts/minute per IP,
# bursts of 20 allowed, excess rejected with 503.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Let's Encrypt HTTP-01 challenge (certbot writes into this webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/designtree/locations.conf;
}

# LAN HTTPS: keep the bootstrap certificate (SANs: LAN IP + public IP) so
# https://192.168.1.50 stays valid on PCs that trust the DesignTree LAN CA.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/designtree/locations.conf;
}

# Public HTTPS: the router forwards WAN:443 to this host's 4433. Once certbot
# issues the Let's Encrypt certificate for the public IP, the browser sees a
# publicly trusted padlock at https://<public-ip> with no port in the URL.
server {
    listen 4433 ssl;
    server_name _;

    ssl_certificate     __PUBLIC_CERT_PATH__;
    ssl_certificate_key __PUBLIC_KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/designtree/locations.conf;
}
