# LAN HTTPS: keep the bootstrap certificate (SANs: LAN IP + public IP) so
# https://192.168.1.50 stays valid on PCs that trust the DesignTree LAN CA.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/designtree/locations.conf;
}

# Public HTTPS: the router forwards WAN:443 to this host's 4433. Once certbot
# issues the Let's Encrypt certificate for the public IP, the browser sees a
# publicly trusted padlock at https://<public-ip> with no port in the URL.
server {
    listen 4433 ssl;
    server_name _;

    ssl_certificate     __PUBLIC_CERT_PATH__;
    ssl_certificate_key __PUBLIC_KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

