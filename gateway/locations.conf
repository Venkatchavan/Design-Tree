# Shared locations — included by the HTTP (80), LAN HTTPS (443), and public
# HTTPS (4433) servers.

# --- Live bell pushes (socket.io). Single server, so no sticky-session
# handling is needed; the Upgrade headers are the critical part.
location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long-poll fallback + WS both stream; buffering would delay pushes.
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# --- API: cookie JWT passes through; nothing is stripped. ---
location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Slow down password guessing on the sign-in endpoint only.
location = /api/auth/login {
    limit_req zone=login burst=20 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- DB admin (mongo-express) is disabled by default. ---
# The legacy image has an EOL runtime and is only started explicitly with the
# `dbadmin` profile. It is bound to host loopback (127.0.0.1:18081), never
# proxied through the gateway. Explicit 403 also lets nginx start while the
# service is disabled.
location /dbadmin/ {
    return 403;
}
location = /dbadmin {
    return 403;
}

# --- PWA manifest: stock mime.types has no .webmanifest entry, so serve
# it with the spec type here. Exact-match wins over `location /`.
location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
}

# --- SPA: static files, client-side routing fallback. ---
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
